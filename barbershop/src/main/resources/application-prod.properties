server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET search_path TO public

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

app.frontend.url=${APP_FRONTEND_URL}
app.api.url=${APP_API_URL}

app.business.name=ElPipeBarber
app.business.address=La Galaxia 2292, Maipu
app.business.phone=+56 9 9809 8449

# Admin 1: Felipe (dueno)
app.seed.admin.email=${APP_ADMIN_EMAIL}
app.seed.admin.password=${APP_ADMIN_PASSWORD}
app.seed.admin.name=${APP_ADMIN_NAME:Felipe Eliecer}

